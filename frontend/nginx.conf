# Serves the built SPA and proxies the API, so the browser only ever talks to
# one origin and CORS never comes into it.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The PDF download streams a file; allow for a slow render on first request.
    client_max_body_size 2m;
    proxy_read_timeout 60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on old asset
    # URLs that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        # `backend` is the service name on the compose network.
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend reads this for the audit trail's ip_address field.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # Client-side routing: any unknown path is handled by the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Modest hardening for a static bundle.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
