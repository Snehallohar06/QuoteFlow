[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --tb=short

# One event loop for the whole session, shared with the single MongoDB client.
# A per-test loop would leave the async driver bound to a closed loop.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

filterwarnings =
    error::UserWarning
    ignore::DeprecationWarning

markers =
    engine: pure rule-engine tests that need no database
    workflow: end-to-end workflow tests
